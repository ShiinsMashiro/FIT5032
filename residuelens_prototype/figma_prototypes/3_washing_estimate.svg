transform="translate(347.0,88.0) scale(0.75)"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="none" stroke="#7FA396" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="18" y="142" font-family="'Roboto Mono', Menlo, monospace" font-size="10" fill="#0F6E56" font-weight="500" letter-spacing="1.6">WHAT TO DO</text><text x="18" y="176" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#1C1C1A" font-weight="400" letter-spacing="-1">Wash as usual</text><text x="18" y="214" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#1C1C1A" font-weight="400" letter-spacing="-1">(general hygiene)</text><rect x="18" y="252" width="34" height="2" fill="#0F6E56" rx="1"/><text x="18" y="282" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#5F5E5A" font-weight="400">No study has measured blueberries directly.</text><text x="18" y="306" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#5F5E5A" font-weight="400">This estimate uses measured wash results for</text><text x="18" y="330" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#5F5E5A" font-weight="400">the same chemicals found on them.</text><text x="18" y="364" font-family="'Roboto Mono', Menlo, monospace" font-size="10" fill="#A8A69C" font-weight="400" letter-spacing="1.1" style="text-decoration:underline">ESTIMATE · NO BLUEBERRY-SPECIFIC STUDY</text><rect x="18" y="394" width="354" height="0.5" fill="#E2E0D8"/><text x="18" y="416" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#1C1C1A" font-weight="400">Washing estimate</text><text x="346" y="416" font-family="'Roboto Mono', Menlo, monospace" font-size="12" fill="#A8A69C" font-weight="400" text-anchor="end">01</text><g transform="translate(353.0,403.0) scale(0.75)"><path d="M18 15l-6-6-6 6" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="18" y="456" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#1C1C1A" font-weight="600">What washing is likely to do</text><text x="18" y="478" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">42 chemicals were found on blueberry. 40 of them (95%) have</text><text x="18" y="496" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">measured wash results on other produce — matched by CAS number</text><text x="18" y="514" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">and method.</text><rect x="18" y="532" width="354" height="34" fill="#EFEEE9" rx="10"/><rect x="21" y="535" width="87.0" height="28" fill="#12211D" rx="8"/><text x="64.5" y="553" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">Rinse</text><text x="151.5" y="553" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle">Water soak</text><text x="238.5" y="553" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle">Baking soda</text><text x="325.5" y="553" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle">Vinegar</text><text x="18" y="594" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#1C1C1A" font-weight="300" letter-spacing="-2">≈45%</text><text x="132" y="594" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">estimated reduction</text><circle cx="260" cy="590" r="4.875" fill="none" stroke="#A8A69C" stroke-width="1.0833333333333333"/><g transform="translate(253.5,583.5) scale(0.5416666666666666)"><path d="M12 16v-4" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(253.5,583.5) scale(0.5416666666666666)"><path d="M12 8h.01" fill="none" stroke="#A8A69C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="18" y="622" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400">where the same chemicals were studied</text><rect x="18" y="636" width="354" height="10" fill="#EFEEE9" rx="5"/><clipPath id="wtrack"><rect x="18" y="636" width="354" height="10" rx="5"/></clipPath><g clip-path="url(#wtrack)"><rect x="124" y="636" width="106" height="10" fill="#1D9E75" opacity="0.55"/></g><text x="18" y="662" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400">0%</text><text x="195" y="662" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="middle">50%</text><text x="372" y="662" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="end">100%</text><rect x="18" y="664" width="200" height="26" fill="#E1F5EE" rx="13"/><circle cx="32" cy="677" r="3" fill="#085041"/><text x="42" y="681" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#085041" font-weight="600" letter-spacing="0.3">Estimate · checked against studies</text><text x="18" y="702" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">Where this method could be checked against real studies, it</text><text x="18" y="720" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8A8880" font-weight="400">came within a median of 12 points of the measured value.</text><text x="18" y="730" font-family="'Roboto Mono', Menlo, monospace" font-size="9" fill="#A8A69C" font-weight="400" letter-spacing="0.8">CHECKED ON 23 ITEMS THAT DO HAVE STUDIES</text><rect x="18" y="750" width="354" height="0.5" fill="#E2E0D8"/><text x="18" y="768" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400">Boscalid</text><text x="300" y="768" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="end">elsewhere</text><text x="372" y="768" font-family="'Roboto Mono', Menlo, monospace" font-size="12" fill="#1C1C1A" font-weight="500" text-anchor="end">48%</text><rect x="18" y="776" width="354" height="0.5" fill="#E2E0D8"/><text x="18" y="794" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400">Pyraclostrobin</text><text x="300" y="794" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="end">elsewhere</text><text x="372" y="794" font-family="'Roboto Mono', Menlo, monospace" font-size="12" fill="#1C1C1A" font-weight="500" text-anchor="end">63%</text><rect x="18" y="802" width="354" height="0.5" fill="#E2E0D8"/><text x="18" y="820" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400">Cyprodinil</text><text x="300" y="820" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="end">elsewhere</text><text x="372" y="820" font-family="'Roboto Mono', Menlo, monospace" font-size="12" fill="#1C1C1A" font-weight="500" text-anchor="end">41%</text><rect x="18" y="828" width="354" height="0.5" fill="#E2E0D8"/><text x="18" y="846" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5F5E5A" font-weight="400">Fenhexamid</text><text x="300" y="846" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="400" text-anchor="end">elsewhere</text><text x="372" y="846" font-family="'Roboto Mono', Menlo, monospace" font-size="12" fill="#1C1C1A" font-weight="500" text-anchor="end">52%</text><rect x="0" y="780" width="390" height="64" fill="#FFFFFF"/><rect x="0" y="780" width="390" height="0.5" fill="#E2E0D8"/><g transform="translate(54.5,788.5) scale(0.875)"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(54.5,788.5) scale(0.875)"><path d="M9 22V12h6v10" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="65.0" y="827" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0F6E56" font-weight="600" text-anchor="middle">Home</text><g transform="translate(184.5,788.5) scale(0.875)"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(184.5,788.5) scale(0.875)"><path d="M3 6h18" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(184.5,788.5) scale(0.875)"><path d="M16 10a4 4 0 0 1-8 0" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="195.0" y="827" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A8A69C" font-weight="600" text-anchor="middle">Basket</text><g transform="translate(314.5,788.5) scale(0.875)"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="none" stroke="#A8A69C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="